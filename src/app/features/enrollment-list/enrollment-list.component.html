<div class="enrollment-table">

  <div class="table-toolbar">

    <div>

      <h3>
        Enrollment Requests
      </h3>

      <p>
        Review pending enrollment requests.
      </p>

    </div>

    <span class="request-count">
      {{ store.entities().length }}
      total
    </span>

  </div>


  <div class="table-scroll">

    <table
      mat-table
      [dataSource]="dataSource"
      matSort
    >

      <ng-container matColumnDef="studentName">

        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
        >
          Student
        </th>

        <td
          mat-cell
          *matCellDef="let row"
        >

          <div class="student-cell">

            <div class="student-avatar">
              {{ row.studentName?.charAt(0) }}
            </div>

            <span>
              {{ row.studentName }}
            </span>

          </div>

        </td>

      </ng-container>


      <ng-container matColumnDef="courseName">

        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
        >
          Course
        </th>

        <td
          mat-cell
          *matCellDef="let row"
        >

          <span class="course-name">
            {{ row.courseName }}
          </span>

        </td>

      </ng-container>


      <ng-container matColumnDef="status">

        <th
          mat-header-cell
          *matHeaderCellDef
          mat-sort-header
        >
          Status
        </th>

        <td
          mat-cell
          *matCellDef="let row"
        >

          <span
            class="status"
            [class.approved]="row.status === 'Approved'"
            [class.pending]="row.status === 'Pending'"
          >
            <span class="status-dot"></span>
            {{ row.status }}
          </span>

        </td>

      </ng-container>


      <ng-container matColumnDef="actions">

        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Action
        </th>

        <td
          mat-cell
          *matCellDef="let row"
        >

          @if (row.status === 'Pending') {

            <button
              type="button"
              class="approve-button"
              (click)="store.approveEnrollment(row.id)"
            >
              <span>✓</span>
              Approve
            </button>

          } @else {

            <span class="completed">
              Completed
            </span>

          }

        </td>

      </ng-container>


      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
      ></tr>

      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns;
        "
      ></tr>

    </table>

  </div>


  <mat-paginator
    [pageSizeOptions]="[10, 25, 50]"
    showFirstLastButtons
  ></mat-paginator>

</div>
